<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Catalogue</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f2f2f2;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      width: 300px;
      margin: 0 auto;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      text-align: center;
    }

    .card img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .card h2 {
      margin: 15px 0 10px;
    }

    .card a {
      display: inline-block;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h1>Card Catalogue</h1>

  <div class="card">
    <img
      src="https://raw.githubusercontent.com/godlesskoti/card-catalogue/main/previews/Ancestral%20Call.jpg"
      alt="Ancestral Call"
    >

    <h2>Ancestral Call</h2>

    <a
      href="https://drive.google.com/file/d/1QtBtP8LOyRDZTXnuFJwiZ0_u6kss0liE/view"
      target="_blank"
    >
      Open PDF
    </a>
  </div>

</body>
</html>
