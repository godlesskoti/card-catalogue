<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Card Catalogue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 25px;
      background: #f2f2f2;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px;
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls input,
    .controls select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .controls input {
      width: 300px;
    }

    .results {
      max-width: 1200px;
      margin: 0 auto 20px;
      text-align: center;
      color: #666;
    }

    .catalogue {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      text-align: center;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .card h2 {
      font-size: 20px;
      margin: 12px 0 8px;
    }

    .card-info {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      min-height: 42px;
    }

    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .download:hover {
      background: #444;
    }

    .message {
      text-align: center;
      max-width: 700px;
      margin: 50px auto;
      font-size: 18px;
      color: #666;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .controls input {
        width: 100%;
      }

      .controls select {
        width: 100%;
      }

      .catalogue {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        padding: 8px;
      }

      .card h2 {
        font-size: 15px;
      }

      .card-info {
        font-size: 12px;
      }

      .download {
        font-size: 12px;
        padding: 8px 10px;
      }
    }
  </style>

</head>

<body>

  <h1>Card Catalogue</h1>

  <div class="controls">

```
<input
  type="text"
  id="search"
  placeholder="Search cards..."
>

<select id="faction">
  <option value="">All factions</option>
</select>

<select id="category">
  <option value="">All categories</option>
</select>
```

  </div>

  <div class="results" id="results">
    Loading cards...
  </div>

  <div class="catalogue" id="catalogue"></div>

  <div class="message" id="message"></div>

  <script>

    const GITHUB_RAW =
      "https://raw.githubusercontent.com/godlesskoti/card-catalogue/main/";

    const DRIVE_DOWNLOAD =
      "https://drive.google.com/uc?export=download&id=";


    let cards = [];


    // ============================================
    // LOAD CARDS
    // ============================================

    async function loadCards() {

      try {

        const response = await fetch("cards.json");

        if (!response.ok) {
          throw new Error("Could not load cards.json");
        }

        cards = await response.json();

        setupFilters();

        displayCards();

      } catch (error) {

        console.error(error);

        document.getElementById("results").textContent =
          "Could not load the card catalogue.";

        document.getElementById("message").textContent =
          "Make sure cards.json is in the main GitHub repository folder.";

      }

    }


    // ============================================
    // FILTER SETUP
    // ============================================

    function setupFilters() {

      const factions = new Set();
      const categories = new Set();

      cards.forEach(card => {

        if (card.faction) {
          factions.add(card.faction);
        }

        if (card.category) {
          categories.add(card.category);
        }

      });


      const factionSelect =
        document.getElementById("faction");

      [...factions]
        .sort()
        .forEach(faction => {

          const option =
            document.createElement("option");

          option.value = faction;
          option.textContent = faction;

          factionSelect.appendChild(option);

        });


      const categorySelect =
        document.getElementById("category");

      [...categories]
        .sort()
        .forEach(category => {

          const option =
            document.createElement("option");

          option.value = category;
          option.textContent = category;

          categorySelect.appendChild(option);

        });

    }


    // ============================================
    // DISPLAY CARDS
    // ============================================

    function displayCards() {

      const catalogue =
        document.getElementById("catalogue");

      const message =
        document.getElementById("message");

      const results =
        document.getElementById("results");


      catalogue.innerHTML = "";
      message.textContent = "";


      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const selectedFaction =
        document
          .getElementById("faction")
