<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Catalogue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 25px;
      background: #f2f2f2;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px;
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls input,
    .controls select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .controls input {
      width: 300px;
    }

    .results {
      max-width: 1200px;
      margin: 0 auto 20px;
      text-align: center;
      color: #666;
    }

    .catalogue {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .card img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .card h2 {
      font-size: 20px;
      margin: 12px 0 8px;
    }

    .card-info {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      min-height: 42px;
    }

    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .download:hover {
      background: #444;
    }

    .message {
      text-align: center;
      max-width: 700px;
      margin: 50px auto;
      font-size: 18px;
      color: #666;
    }
  </style>

</head>

<body>

  <h1>Card Catalogue</h1>

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="Search cards..."
    >

```
<select id="faction">
  <option value="">All factions</option>
</select>

<select id="category">
  <option value="">All categories</option>
</select>
```

  </div>

  <div class="results" id="results">
    Loading cards...
  </div>

  <div class="catalogue" id="catalogue"></div>

  <div class="message" id="message"></div>

  <script>

    const CARDS_URL =
      "https://raw.githubusercontent.com/godlesskoti/card-catalogue/main/cards.json";

    const GITHUB_RAW =
      "https://raw.githubusercontent.com/godlesskoti/card-catalogue/main/";

    let cards = [];


    async function loadCards() {

      try {

        const response = await fetch(
          CARDS_URL + "?v=" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        cards = await response.json();

        if (!Array.isArray(cards)) {
          throw new Error(
            "cards.json is not an array"
          );
        }

        setupFilters();
        displayCards();

      } catch (error) {

        console.error(error);

        document.getElementById("results").textContent =
          "Could not load cards.json.";

        document.getElementById("message").textContent =
          "Error: " + error.message;

      }

    }


    function setupFilters() {

      const factions = new Set();
      const categories = new Set();

      cards.forEach(card => {

        if (card.faction) {
          factions.add(card.faction);
        }

        if (card.category) {
          categories.add(card.category);
        }

      });

      const factionSelect =
        document.getElementById("faction");

      [...factions]
        .sort()
        .forEach(faction => {

          const option =
            document.createElement("option");

          option.value = faction;
          option.textContent = faction;

          factionSelect.appendChild(option);

        });


      const categorySelect =
        document.getElementById("category");

      [...categories]
        .sort()
        .forEach(category => {

          const option =
            document.createElement("option");

          option.value = category;
          option.textContent = category;

          categorySelect.appendChild(option);

        });

    }


    function displayCards() {

      const catalogue =
        document.getElementById("catalogue");

      const message =
        document.getElementById("message");

      const results =
        document.getElementById("results");

      catalogue.innerHTML = "";
      message.textContent = "";


      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      const selectedFaction =
        document
          .getElementById("faction")
          .value;


      const selectedCategory =
        document
          .getElementById("category")
          .value;


      const filtered =
        cards.filter(card => {

          if (!card.preview) {
            return false;
          }

          const searchableText = [
            card.name,
            card.faction,
            card.colour1,
            card.colour2,
            card.category,
            card.cost,
            card.text
          ]
          .join(" ")
          .toLowerCase();


          if (
            search &&
            !searchableText.includes(search)
          ) {
            return false;
          }


          if (
            selectedFaction &&
            card.faction !== selectedFaction
          ) {
            return false;
          }


          if (
            selectedCategory &&
            card.category !== selectedCategory
          ) {
            return false;
          }


          return true;

        });


      results.textContent =
        `Showing ${filtered.length} of ${cards.length} cards`;


      if (filtered.length === 0) {

        message.textContent =
          "No cards with previews match your search.";

        return;

      }


      filtered.forEach(card => {

        const cardElement =
          document.createElement("div");

        cardElement.className = "card";


        const image =
          document.createElement("img");

        image.src =
          GITHUB_RAW +
          card.preview
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");

        image.alt = card.name;
        image.loading = "lazy";


        const title =
          document.createElement("h2");

        title.textContent = card.name;


        const info =
          document.createElement("div");

        info.className = "card-info";

        const details = [];

        if (card.faction) {
          details.push(card.faction);
        }

        if (card.category) {
          details.push(card.category);
        }

        if (card.cost) {
          details.push(card.cost);
        }

        info.textContent =
          details.join(" • ");


        cardElement.appendChild(image);
        cardElement.appendChild(title);
        cardElement.appendChild(info);

        catalogue.appendChild(cardElement);

      });

    }


    document
      .getElementById("search")
      .addEventListener(
        "input",
        displayCards
      );


    document
      .getElementById("faction")
      .addEventListener(
        "change",
        displayCards
      );


    document
      .getElementById("category")
      .addEventListener(
        "change",
        displayCards
      );


    loadCards();

  </script>

</body>
</html>
