<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎴 Card Catalogue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #eee;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: #1b1b1b;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .catalogue {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 220px;
            padding: 10px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 12px;
            text-align: center;
        }

        .card img {
            display: block;
            width: 100%;
            aspect-ratio: 64 / 88;
            object-fit: contain;
            border-radius: 6px;
            background: #222;
        }

        .card h2 {
            font-size: 18px;
            margin: 12px 0 4px;
        }

        .card p {
            margin: 4px 0;
            color: #aaa;
            font-size: 14px;
        }

        .card a {
            display: inline-block;
            margin-top: 12px;
            padding: 9px 14px;
            border-radius: 7px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .card a:hover {
            background: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>🎴 Card Catalogue</h1>
</header>

<main class="catalogue">

    <div class="card">

        <img src="https://drive.google.com/uc?export=view&id=1UNtSBdXRkrLioqdV6YwGikGy9gTF0DD-" alt="Ancestral Call">

        <h2>Ancestral Call</h2>

        <p>Test card</p>

        <a
            href="https://drive.google.com/file/d/1QtBtP8LOyRDZTXnuFJwiZ0_u6kss0liE/view?usp=drive_link"
            target="_blank"
        >
            📄 Download PDF
        </a>

    </div>

</main>

</body>
</html>
